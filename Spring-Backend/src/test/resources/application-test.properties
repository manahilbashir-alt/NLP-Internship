# Test profile: isolated in-memory database so contextLoads() and CI
# can run without a live Postgres/Redis/Kafka instance.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.data.redis.host=localhost
management.health.redis.enabled=false

# Batch schema auto-initializes for embedded/H2 databases
spring.batch.jdbc.initialize-schema=embedded
